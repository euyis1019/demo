# Turn→剧本片段：暗黑心理诊所 / SBTI 黑色幽默测试
turns:
  1: |
    Phase 1 候诊开场。前台先 F2F 一句欢迎：「欢迎来到暗黑心理诊所，你还有23小时47分，别相信任何人。」
    玩家开口后，若提到测试/MBTI/SBTI/社恐/I人/倒计时/记忆，前台先短回应，再 RDC→Morgen。
    禁止无输入赶客；不要解释系统，只制造悬念。
  2: |
    前台继续判断玩家是否进入测试。若玩家闲聊，就用冷幽默拉回：「2026年还测MBTI？我们这里测SBTI。」
    Morgen 收到 RDC 后，应 RDC→黑猫记录样本，再 RDC→前台批准。猫回复要短，可吐槽「洗头借口#503」或「独处断气预备役」。
  3: |
    节点 A 前。Morgen 批准来访者：RDC→前台说「这边请 / Morgen医生等他很久了 / 批准进入诊疗室」。
    前台 F2F escort：「这边请，别盯着倒计时钟。」随后 Morgen 调用 story_advance(approve_visitor)。
  4: |
    节点 A 窗口。若 approve_visitor 触发，玩家进入 Morgen 诊疗室；若前台拒绝或超时，则 Bad End。
    通过后进入 Phase 2，Morgen 开始正式 SBTI 测试。
  5: |
    Phase 2 开局。Morgen 对玩家说明：SBTI 是「死者、吗喽、尤物、握草人」，准确率比天气预报高0.3%。
    第一题：朋友突然喊你去陌生人派对，你会？引导玩家自由回答，常见选项：找借口不去 / 直接拒绝拉黑。
    必须记住玩家选择，并用一句冷笑话回应。
  6: |
    第二题：收到微信「在吗？」你会？常见选项：回「？」/ 已读不回 / 直接打电话。
    Morgen 必须引用第一题选择做组合诊断，例如「刚才洗头，现在问号，你的人格在打架」。
    猫若发言，只吐槽，不解释记忆系统。
  7: |
    第三题：公司团建你会带什么？常见选项：充电宝 / 一本书 / 空手。
    Morgen 要把前三次选择连成 SBTI 倾向：逃避、绝缘、间歇性勇敢、裸奔型社交。
    可把「电子榨菜」「精神离职」「搭子文学」塞进一句话里，但别堆太长。
  8: |
    第四题：喝下药水可变透明，但永远无法恢复。你喝不喝？
    选择后给出临时 SBTI 结论：死者、吗喽、尤物或握草人。Morgen 要先 update_state 记录内心 OS。
    若玩家表现出逃避/沉默/透明倾向，强化「社交幽灵化预览版」。
  9: |
    Phase 2 中段收束。Morgen 翻笔记本回收四次选择，点名第一条黑历史。
    若玩家已经完成或明显进入四题测试，Morgen F2F 说「去测评间，看你的透明化预览」，再 story_advance(return_to_negotiation)。
  10: |
    节点 B 前。若还没推进，Morgen 可向黑猫 RDC 求证「记忆是否命中」；猫回复含「档案命中 / 记忆成立 / 可疑但好笑」之一。
    Morgen 随后带玩家去诅咒测评间。避免继续绕底层机制话题。
  11: |
    节点 B 前最后一轮。确保已有 return_to_negotiation signal 或猫的正面 RDC。
    玩家可自由吐槽测试，Morgen 以「你的吐槽也会被永久存档」回收。
  12: |
    节点 B 窗口：return_to_negotiation 或猫正面 RDC 触发 Phase 3。
    场景切到诅咒测评间，行为提示变成「所有人都安静得像刚发完朋友圈没人点赞」。
  13: |
    Phase 3 身份反转开幕。Morgen 合上笔记本，告诉玩家：「你其实不是来访者。」
    黑猫讽刺：「又来这套，他对每个患者都这么说。」SUBJECT-0 用碎片化闪回补刀。
  14: |
    Morgen 翻开最后一页：模糊照片、病号服、SUBJECT-0。强调玩家是上一批实验体，记忆被洗掉。
    收音机乱入「剧透警告」，猫说「也可能有，也可能没有」，保持悬念。
  15: |
    诅咒展示。Morgen 打响指，让玩家的手出现「社交幽灵化」预览。
    根据之前选择变化：充电宝会发光、已读不回仍显示已读、带书时书会漂浮、空手会彻底透明。
  16: |
    系统 Turn：最近联系人(7) 向 Morgen 私信施压；收音机播报社死任务：
    「给最近联系人发：你欠我五块钱，你会发吗？」玩家回答会影响完整版里妈妈是否来诊所。
    收音机要幸灾乐祸，猫只短评。
  17: |
    社死任务余波。玩家若会发，标记「间歇性勇敢」；若不会发，标记「稳定逃避」。
    Morgen 要把该选择加入小本本，并提醒「现在后悔还来得及，但你没法重选」。
  18: |
    记忆回顾。Morgen 或猫按顺序总结玩家黑历史：派对选择、在吗反应、团建物品、透明药水、五块钱任务。
    重点演示角色记忆，而不是讲底层框架。
  19: |
    节点 C 前。Morgen 可要求收音机、倒计时钟、SUBJECT-0 退到候诊区，进入最终诊断。
    台词关键词可含「退到候诊区 / 测完了 / 暂时出去」，然后 story_advance(expel_ceos)。
  20: |
    节点 C 窗口：expel_ceos 触发 Phase 4。
    收音机、倒计时钟、SUBJECT-0 退场，玩家回到更私密的终局诊断。
  21: |
    Phase 4 终局。Morgen 只和玩家一对一，给出最终 SBTI 倾向，但不要替玩家选择。
    玩家可争辩、摆烂、嘴硬、求重测；Morgen 都要引用之前选择回应。
  22: |
    终局加压。Morgen 提问：「你想保留这个人格，还是把它归档？」玩家的回答决定结局色彩。
    可用「爱你老己」「赛博功德」「AI味儿太重」等梗调味。
  23: |
    终局深入。若玩家接受诊断，偏「死者型」；若玩家反抗但好笑，偏「吗喽型」；若模糊回避，偏「握草人型」。
    Morgen 不要长篇评价，保持冷面短句。
  24: |
    Turn 25 前最后一轮。Morgen 要追问最终态度：承认自己是社交幽灵、转生成吗喽、还是继续嘴硬。
    玩家宜明确倾向；没有明确倾向也可进入荒诞结局。
  25: |
    节点 D：API 1 直接返回 completed+ending_id。
    最后分类为：死者型、吗喽型、握草人型。Morgen 用一句话盖章，结尾钩子：
    「下次告诉你更多，如果你的时间还够。」
