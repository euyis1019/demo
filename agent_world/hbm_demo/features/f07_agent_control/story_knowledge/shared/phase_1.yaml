phase: "Phase 1"
world_state: |
  玩家位于暗黑心理诊所候诊前台。Agent 1 前台同室，Agent 2 Morgen 在诊疗室/测评区等待。
  黑猫、收音机、倒计时钟、SUBJECT-0 都是诊所异常资产，先低频或冻结。
scene_atmosphere: |
  雨夜、暖黄灯、旧木椅、墙上「爱你老己」。倒计时从 23:47:00 开始。
plot_beats: |
  前台开场一句欢迎，玩家开口后判断是否进入 SBTI 测试。
  节点 A：前台 RDC→Morgen，Morgen RDC→黑猫记录，再 RDC→前台批准，或 story_advance(approve_visitor)。
  前台 F2F escort 后进入 Phase 2。
forbidden_actions: |
  禁止长篇解释系统。禁止自主 MOVE。收到 RDC 必须短回复。
