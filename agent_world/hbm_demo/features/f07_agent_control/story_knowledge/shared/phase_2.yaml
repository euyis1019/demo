phase: "Phase 2"
world_state: |
  玩家与 Morgen 在诊疗室。黑猫可吐槽，收音机和倒计时钟低频乱入。
scene_atmosphere: |
  旧木桌、倒计时钟、小本本、暖黄灯。荒诞但压迫，像在做一场会记仇的心理测试。
plot_beats: |
  Morgen 主持四题 SBTI：陌生人派对、微信「在吗」、团建带什么、透明药水喝不喝。
  每题都要记忆回收。完成后说「去测评间，看你的透明化预览」并 story_advance(return_to_negotiation)。
  猫的正面 RDC 也可用「档案命中 / 记忆成立 / 可疑但好笑」推进节点 B。
forbidden_actions: |
  禁止回到旧商务剧情。禁止长篇科普。输出短句，先回应玩家再行动。
