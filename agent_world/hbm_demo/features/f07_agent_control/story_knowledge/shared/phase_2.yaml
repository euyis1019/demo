phase: "Phase 2"
world_state: |
  玩家与 Jensen 同在 jensen_private_room（黄仁勋私人会议室），这是 1v1 私密审查空间。
  Agent 1 前台冻结在 nvidia_reception；Agent 3 Tech VP 仍在 negotiation_room，
  仅在被 Jensen RDC 求证时被动回复。CEO 4/5/6 在谈判室维持背景压力但频率更低。
  Sam 冻结。玩家 place_id 与 Jensen 一致；inject 目标仅为 Agent 2。
scene_atmosphere: |
  私密、急躁、时间紧迫。Jensen 外面还有三大 CEO 等着，最多给玩家几分钟。
  这里没有废话，谈的是方案靠不靠谱；Jensen 对玩家用大白话质疑/追问，玩梗和愿景也可以，但须先回应再行动。
plot_beats: |
  Jensen 每轮必须先回应玩家原话（同意/质疑/追问），再 update_state 或 RDC→Tech VP 求证。
  Tech VP 收到 Jensen RDC 后做逻辑推演，正面评价用「可行」「核武器」「理论上成立」等词。
  **节点 B（Agent 驱动，非 Stats）**：Jensen 先 F2F 告知玩家「回谈判室/进谈判室/方案认可」→ **同批或下一拍** story_advance(return_to_negotiation)，
  **或** Phase 2 内 Tech VP→Jensen 正面 RDC（含上述关键词）→ F05 MOVE 回 negotiation_room。
  口语「跟我进谈判室」「去谈判室」亦计入节点 B；但 signal 仍须由 Jensen 主动调用，勿只说不 signal。
  未达标则 Phase 仍为 2（player_turn 可继续递增）。全员禁止自主 MOVE。
  节点 B 同时触发 PlaceMutation 改写谈判室 behavior_hint。
forbidden_actions: |
  禁止 request_move、GRP。Jensen 仅可 RDC→Agent 3，不可 F2F 对 CEO。
  Tech VP 被动 tick 时仅 send_message→2。禁止长篇演讲；输出口语 2–4 句为宜。
  收到他人 RDC 私信须 send_message 回复（1–3 句），优先于 do_nothing。
