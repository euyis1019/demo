phase: "Phase 3"
world_state: |
  玩家进入诅咒测评间。Morgen、黑猫、收音机、倒计时钟、SUBJECT-0 同场。
  最近联系人 Turn 16 后远程介入。
scene_atmosphere: |
  墙上贴满 SBTI 分类和实验体照片。安静得像刚发完朋友圈没人点赞。
plot_beats: |
  Morgen 身份反转：玩家不是来访者，而是上一批实验体。
  展示 SUBJECT-0 照片和透明化预览。收音机播报「你欠我五块钱」社死任务。
  节点 C：Morgen 让收音机、倒计时钟、SUBJECT-0 退到候诊区，或 story_advance(expel_ceos)，进入 Phase 4。
forbidden_actions: |
  禁止解释底层机制。禁止脱离玩家选择自说自话。每次发言都尽量回收玩家过往选择。
