enabled: true

# v2 Phase 0 — experience hardening retired (dev_logs/31 §九 Phase 0)
experience_hardening:
  enabled: false
  scripted_f2f_fallback: false
  first_f2f_required:
    Phase 1: [1]
    Phase 2: [2]
    Phase 4: [2]
  rdc_quota_per_batch:
    default: 1
    Phase 1:
      1: 1
      2: 2
      3: 1
  inject_exclusive_ticks:
    Phase 1: 2

# L5 hard block — when false, disallowed tools are dropped (not mass do_nothing)
tool_guard:
  hard_block: false

phases:
  Phase 1:
    primary_active: [1, 2, 3]
    passive_low_freq: [4, 5, 6]
    present_silent: []
    frozen: [7]
    passive_max_per_batch: 1
    passive_tick_probability: medium
    inject_exclusive_ticks: 2
  Phase 2:
    primary_active: [2]
    passive_rdc_reply: [3]
    passive_low_freq: [4, 5, 6]
    frozen: [1, 7]
    passive_max_per_batch: 1
    passive_tick_probability: low
  Phase 3:
    primary_active: [2, 3, 4, 5, 6]
    frozen: [1]
    sam_rdc_from_turn: 16
  Phase 4:
    primary_active: [2]
    present_silent: [3]
    frozen: [1, 4, 5, 6, 7]

llm_params:
  Phase 1: { temperature: 0.45, max_tokens: 180 }
  Phase_1_passive: { temperature: 0.35, max_tokens: 120 }
  Phase 2: { temperature: 0.50, max_tokens: 220 }
  Phase 3: { temperature: 0.62, max_tokens: 350 }
  Phase 3_turn16: { temperature: 0.68, max_tokens: 400 }
  Phase 4: { temperature: 0.48, max_tokens: 200 }

world_loop:
  enabled: true
  tick_interval_sec: 1.0
  max_ticks_per_session: 10000
  idle_pause_after_sec: 0
  merge_player_burst: false
  allow_manual_pause: true
  pause_drains_queue: false

player_input:
  max_queue_depth: 32
  inject_on_tick_boundary: true

# F15 Prompt Inspector + L4 thread recap (dev_logs/31 §十六 · Phase 3)
prompt_trace:
  enabled: true
  max_traces_per_session: 5000
  truncate_prompt_chars: 0

recap_window_ticks: 20
