places:
- place_id: 别墅大厅
  capacity: 20
  attrs:
    summary: 欧式装修的宽敞大厅，水晶吊灯摇摇欲坠，壁炉里火光明灭。地上铺着波斯地毯，茶几上摆着一副没下完的象棋。窗外风雨大作，雷声阵阵。
    behavior_hint: 适合集体对峙、公开审讯、交换信息
- place_id: 书房
  capacity: 5
  attrs:
    summary: 老爷生前最常待的地方，红木书桌上散落着账本和信函。书架后有一扇暗门。地上倒着一把太师椅，书桌一角有干涸的血迹。
    behavior_hint: 适合搜查线索、发现秘密文件、触发关键回忆
- place_id: 厨房
  capacity: 8
  attrs:
    summary: 老式灶台，墙上挂着各种铜锅铁铲。案板上放着半只没切完的鸡，菜刀插在刀架上。后门通往后院，门缝里灌进冷风。
    behavior_hint: 适合私下交谈、发现饮食相关线索、偷听墙角
- place_id: 二楼卧室
  capacity: 4
  attrs:
    summary: 三姨太的香闺，粉色帷幔，梳妆台上摆满西洋香水。床头柜上有一张少爷穿着西装的老照片，被压在香水瓶下面。
    behavior_hint: 适合发现私人物品、情感线索、秘密信件
- place_id: 客房
  capacity: 3
  attrs:
    summary: 老中医暂住的房间，简朴整洁。桌上摊着一本《本草纲目》，旁边放着一个小药碾子，里面还有药渣。窗户被木板钉死了。
    behavior_hint: 适合发现药物相关线索、藏匿物品、单人沉思
- place_id: 地下室
  capacity: 10
  attrs:
    summary: 阴暗潮湿的酒窖，木架上放着几排洋酒和绍兴黄酒。角落里堆着废弃的家具。空气中弥漫着霉味和酒味。有一扇铁门通往外面，但被锁死了。
    behavior_hint: 适合发现隐藏通道、藏匿尸体、私下交易
