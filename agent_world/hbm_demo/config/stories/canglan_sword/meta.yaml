onboarding:
  title: 沧澜剑派：夜遇鬼影
  background: 你是沧澜剑派新入门的外姓弟子，刚拜入山门不到三月。今夜，掌门沈孤鸿重病昏迷、传位之争暗流汹涌，你本只想在后庭院散步散心，却不料撞见一个鬼鬼祟祟的身影从掌门寝居方向走来——他袖中似藏着药瓶，已发现了你。你要在这盘棋中自保，还是主动探寻真相？
  tips:
  - · 直接打字，对眼前‘鬼影’说话、质问或试探，看他如何回应
  - · 想避开此人？用下方动作条『移动』溜去其它地点，如掌门寝居或藏书阁
  - · 觉得孤立无援？试试『私信』大师兄凌轩或二师姐苏绾，探探口风
  - · 留意他袖中药瓶——这是关键线索，追问或记下细节都可能改变局势
