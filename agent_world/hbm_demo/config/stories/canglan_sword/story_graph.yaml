schema_version: 1
initial_node: 撞破夜行人
nodes:
- id: 撞破夜行人
  beats_label: 第一幕：夜遇鬼影
  summary: 深更半夜，你在后院撞见鬼影鬼鬼祟祟从掌门居所方向走来，袖中似藏药瓶。你躲进树影，他却已发现你，笑问‘小友夜游，可看见了什么？’
  inject_agents:
  - 5
  place_focus: 后庭院
  scene_brief: 月黑风高，后庭院的老槐树投下鬼魅般的阴影。你刚从茅厕出来，正撞见客卿长老鬼影从掌门寝居方向匆匆走来，他袖口露出一角药瓶，神色有一瞬的慌张，随即化作温和笑容。他拦住你的去路，轻声笑道：‘小友夜游，可看见了什么？’空气里弥漫着一股若有若无的西域药草味，你知道——他绝不止是‘路过的’。
  directions:
    '5': 你是鬼影，刚给掌门下完药出来，没想到撞见这个新来的外姓弟子。你表面客气微笑，实则心念电转——他看见了多少？听见了多少？你不能让他起疑，但也绝不能让他活着把‘看见’说出去。先用长辈般和蔼的语气试探他看到了什么，如果他装傻，就顺势敲打他‘年轻人好奇心重，但有些事知道太多反而不好’，话里带笑却藏着威胁。你袖中的毒药还剩半瓶，必要时可以‘请他喝茶’。
- id: 密室内闻密谋
  beats_label: 第二幕：暗室密语
  summary: 你尾随鬼影至藏书阁密室，偷听到他与凌轩密谈——掌门中毒已深，凌轩答应继位后让鬼影接管外务堂。你脚下踩碎枯枝，惊动二人。
  inject_agents:
  - 2
  - 5
  place_focus: 藏书阁密室
  scene_brief: 你尾随鬼影至藏书阁，见他轻车熟路地按动暗格，闪身消失在墙后。你屏息凑到暗墙缝隙，听见密室中凌轩压低声音催促：‘药量再加三成，那老东西拖太久了。’鬼影阴柔地笑：‘凌公子放心，最多七日，掌门之位便是你的。’你紧张得手心冒汗，脚下却不慎踩断一根枯枝——‘咔嚓’一声，密室内瞬间死寂。
  directions:
    '2': 你是凌轩，正在密室里跟鬼影商量最后的下毒计划，突然听到外面有动静。你瞬间脸色铁青，手按上剑柄，压低声音喝问：‘谁？！’你绝不能让这件事泄露出去——继位就在眼前，任何意外都必须立刻掐灭。你示意鬼影从左边包抄，自己握剑准备从右边冲出，眼神凶狠如狼。
    '5': 你是鬼影，听到动静后反倒露出一个阴冷的微笑。你慢条斯理地把毒药瓶收回袖中，对凌轩做了个‘稍安勿躁’的手势，然后轻声说：‘凌公子莫急，或许是只野猫……我去看看。’你嘴上说得轻描淡写，但袖中已滑出一枚淬毒飞镖——如果真是那个小弟子，这一次，你绝不会再让他‘凑巧’活着离开。
- id: 三师弟的筹码
  beats_label: 第三幕：墙头草的赌注
  summary: 你逃至膳房，撞见周平半夜搜刮银两。他狡黠一笑，说‘我知道你撞见了什么——拿这个换你一命’，塞给你一包鬼影与凌轩往来的密信。
  inject_agents:
  - 4
  place_focus: 膳房
  scene_brief: 你慌不择路逃进膳房，灶台余温尚存，米粥的香气还飘在空气中。你正要翻窗出去，却撞见三师兄周平正蹲在米缸旁，怀里揣着几锭碎银和一包东西，脸上挂着被抓现行的尴尬笑容。他眼珠一转，反倒嘿嘿笑了：‘哟，小师弟，你这大半夜的……撞见鬼了？’他拍了拍怀里的那包密信，‘巧了，我这儿也有点‘见不得光’的东西——拿这个换你一命，如何？’
  directions:
    '4': 你是周平，半夜偷完银两正准备溜，却撞见这个新来的小师弟一脸惊慌地闯进来。你立刻明白——他肯定撞上了什么大事。你贪财但也不傻，知道这烫手山芋捏在自己手里迟早要命，不如甩给他。你油腔滑调地先调侃他两句，然后压低声音说：‘我知道你撞见了什么——凌轩和鬼影那些破事，对吧？’你从怀里掏出那包密信塞给他，‘拿着这个去找二师姐，她比我有种。我周平就是个混日子的，不想把小命搭进去。’说完你还顺手从锅里捞了个馒头塞给他，‘吃饱了才好去送死啊，嘿嘿。’
- id: 二师姐的信任
  beats_label: 第四幕：侠心相托
  summary: 你找到苏绾，将密信和所见和盘托出。她沉吟片刻，说‘掌门早有戒心，让我暗中查鬼影。你愿随我赌一把？’她交给你一枚解药和掌门令符。
  inject_agents:
  - 3
  place_focus: 练功房
  scene_brief: 你推开练功房的门时，苏绾正背对着你擦拭长剑，月光从窗外照进来，在她剑刃上凝成一道寒光。桌上摊着一本泛黄的《西域毒经》，旁边放着一枚赤红色的解药和一枚古朴的掌门令符。她听见脚步声，头也不回，只是淡淡问了一句：‘你来了。是来告状，还是来拼命的？’她转过头，眼中既有锐利的审视，也有一丝如释重负——她等你，已经等了很久。
  directions:
    '3': 你是苏绾，三天没合眼，一直在等一个契机。看见这个小师弟深夜带着密信和惊慌到来，你心中便已明白大半。你不想浪费时间寒暄，直接开门见山：‘说吧，你看到了什么？’听他讲完后，你沉默片刻，将解药和令符推到桌上：‘这是解药，这是掌门令符。师父早就知道有人下毒，他让我暗中查鬼影，但我一个人唱不了这出戏——你愿意赌一把吗？’你盯着他的眼睛，语气平静却带着决绝：‘赌赢了，沧澜革新，你我都有活路。赌输了——你我就当今晚没见过，你连夜下山，我一人扛。’
endings:
- id: expose_heir
  kind: good
  summary: 你与苏绾里应外合，在继位大典上当众揭穿鬼影下毒、凌轩勾结的罪证。掌门临终遗命传位苏绾，你被收为内门弟子，门派迎来革新。
- id: framed_fall
  kind: bad
  summary: 凌轩抢先一步，在你告发前反咬你与鬼影勾结、给掌门下毒。你被当众搜出‘毒药’（被调包的解药），逐出师门，江湖上声名狼藉。
- id: leave_sect
  kind: neutral
  summary: 你厌倦这场你死我活的权斗，将密信和解药留在苏绾房门口，于风雨夜悄然离去。此后江湖上多了一个不问世事的无名过客。
edges:
- id: e1
  from: 撞破夜行人
  to: 密室内闻密谋
  condition: 玩家选择假装无事发生、敷衍鬼影后悄悄尾随他，并成功跟踪至藏书阁发现密室入口。
- id: e2
  from: 密室内闻密谋
  to: 三师弟的筹码
  condition: 玩家在被凌轩和鬼影发现后，选择逃跑而非正面迎战，慌不择路逃进膳房。
- id: e3
  from: 密室内闻密谋
  to: 二师姐的信任
  condition: 玩家在被凌轩和鬼影发现后，选择亮明身份并直接周旋，表明自己‘是来告密的’，并成功说服他们带自己去找苏绾（或自己脱身后直接去找苏绾）。
- id: e4
  from: 三师弟的筹码
  to: 二师姐的信任
  condition: 玩家接过周平的密信，决定信任他并去找苏绾告发一切。
- id: e5
  from: 三师弟的筹码
  to: framed_fall
  condition: 玩家拒绝周平的密信，或者拿了密信后犹豫不决、走漏风声，导致凌轩和鬼影抢先一步栽赃玩家。
- id: e6
  from: 二师姐的信任
  to: expose_heir
  condition: 玩家接受苏绾的提议，接过解药和令符，并决定与她联手在继位大典上当众揭发。
- id: e7
  from: 二师姐的信任
  to: leave_sect
  condition: 玩家拒绝苏绾的提议，选择将密信和解药留下，独自离开门派，不再参与这场权斗。
