  capacity: 2
  attrs:
    summary: 剑客的房间，门紧锁
    behavior_hint: 可尝试潜入或敲门
- place_id: inn_stable
  capacity: 5
  attrs:
    summary: 客栈后院的马厩，可通往外面
    behavior_hint: 可藏身或逃跑
