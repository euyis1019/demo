schema_version: 1
initial_node: intro
nodes:
- id: intro
  beats_label: 第一幕：投宿
  summary: 雨夜，旅人来到听雨客栈投宿，老板娘热情接待，店内已有几位客人。
  inject_agents:
  - 0
  place_focus: inn_hall
  window_since: start_tick
- id: observe
  beats_label: 第一幕：观察
  summary: 旅人观察店内众人：神秘剑客独坐角落，行脚商人四处搭话，捕快盘查客人。
  inject_agents:
  - 0
  place_focus: inn_hall
  window_since: intro_end_tick
- id: talk_merchant
  beats_label: 第二幕：商人线索
  summary: 行脚商人暗示剑客可疑，并透露赏金信息，但要求分一杯羹。
  inject_agents:
  - 0
  - 3
  place_focus: inn_hall
  window_since: observe_end_tick
- id: talk_innkeeper
  beats_label: 第二幕：老板娘态度
  summary: 老板娘私下警告旅人不要多管闲事，暗示剑客是常客，但神色紧张。
  inject_agents:
  - 0
  - 1
  place_focus: inn_hall
  window_since: observe_end_tick
- id: confront_swordsman
  beats_label: 第三幕：对峙剑客
  summary: 旅人直接与剑客对话，剑客承认自己是逃犯，但声称被冤枉，请求帮助。
  inject_agents:
  - 0
  - 2
  place_focus: inn_hall
  window_since: talk_merchant_end_tick
- id: final_choice
  beats_label: 第三幕：抉择
  summary: 捕快即将搜查客栈，旅人必须在揭发、协助或离开之间做出选择。
  inject_agents:
  - 0
  place_focus: inn_hall
  window_since: confront_swordsman_end_tick
endings:
- id: expose
  kind: good
  summary: 旅人揭发剑客，捕快将其抓获，旅人获得赏金但内心不安。
- id: framed
  kind: bad
  summary: 旅人被栽赃为同党，被捕快押入大牢。
- id: leave
  kind: neutral
  summary: 旅人趁乱离开客栈，雨夜中继续行程，一切如常。
edges:
- id: e1
  from: intro
  to: observe
  trigger:
    type: story_advance
    signal: intro_done
  actions: []
- id: e2
  from: observe
  to: talk_merchant
  trigger:
    type: rdc_keyword
    sender: 3
    recipient: 0
    keyword_set: merchant_hint
  actions: []
- id: e3
  from: observe
  to: talk_innkeeper
  trigger:
    type: f2f_keyword
    place: inn_hall
    sender: 1
    keyword_set: innkeeper_warning
  actions: []
- id: e4
  from: talk_merchant
  to: confront_swordsman
  trigger:
    type: story_advance
    signal: merchant_talked
  actions: []
- id: e5
  from: talk_innkeeper
  to: confront_swordsman
  trigger:
    type: story_advance
    signal: innkeeper_talked
  actions: []
- id: e6
  from: confront_swordsman
  to: final_choice
  trigger:
    type: story_advance
    signal: confront_done
  actions: []
- id: e7
  from: final_choice
  to: expose
  trigger:
    type: rdc_keyword
    sender: 0
    recipient: 4
    keyword_set: expose_swordsman
  actions: []
- id: e8
  from: final_choice
  to: framed
  trigger:
    type: rdc_keyword
    sender: 4
    recipient: 0
    keyword_set: frame_player
  actions: []
- id: e9
  from: final_choice
  to: leave
  trigger:
    type: story_advance
    signal: player_leaves
  actions: []
