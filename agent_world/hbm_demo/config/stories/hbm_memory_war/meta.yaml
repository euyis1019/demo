# Story Pack 元信息（dev_logs/42 §3）。第一个参考 Story Pack：把现有 HBM 抽成数据，作回归锚点。
schema_version: 1
simulation_id: hbm_memory_war
title: HBM 显存价格保卫战
synopsis: >
  玩家以外来小供应商身份闯入 NVIDIA，凭一套革命性显存压缩算法，
  从前台一路谈进 Jensen 的终局谈判室，决定加入巨头、独立创业还是冷淡收场。

# 故事图入口由 story_graph.yaml 的 initial_node 决定（此处不重复，避免漂移）。
story_graph: story_graph.yaml

player:
  agent_id: 0
  name: 玩家
  start_place: nvidia_reception
  # 玩家拥有 agent 的全部交互权限：私信(RDC)/面对面(F2F)/群聊(GRP)/移动(MOVE)。
  capabilities: [signal_uplink, f2f, group_chat, move]

clock:
  start_time: "14:00"
  minutes_per_tick: 2

# LLM 引用（运行期由 kernel 解析 api_key_env）。沿用现 hbm_scenario.yaml。
llm:
  base_url: https://api.deepseek.com
  api_key_env: DMXAPI_KEY
  model: deepseek-v4-flash
  thinking: disabled
  temperature: 0.65
  max_tokens: 500

game_config:
  max_player_turns: 25
  trust_thresholds:
    join: 25
    seed: 15
