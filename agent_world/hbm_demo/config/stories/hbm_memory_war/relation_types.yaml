# 关系类型语义（dev_logs/46 B-1 实缺口补回）。决定 RDC 远端可达(is_contact) 与互斥校验。
# 运行期 seed 前由 kernel 灌进 RelationGraph.type_meta；未在此声明的类型走引擎默认(is_contact=True)。
relation_types:
  - type: subordinate
    is_contact: true          # 参与 RDC（远端可联系）
    symmetric: false
    mutually_exclusive: []
    display_template: "{src} 从属于 {dst}"

  - type: colleague
    is_contact: true
    symmetric: true
    mutually_exclusive: []
    display_template: "{src} 与 {dst} 是同事"

  - type: business_partner
    is_contact: true
    symmetric: true
    mutually_exclusive: []
    display_template: "{src} 与 {dst} 是商业伙伴"

  - type: ally
    is_contact: true
    symmetric: true
    # 背刺：Samsung 运行期 relation_change(op=break) 解除 ally。结盟与敌对若引入可在此声明互斥。
    mutually_exclusive: []
    display_template: "{src} 与 {dst} 结盟"
