# F18 场景渲染 · 画面 prompt 模板（L0，纯数据）
# prompt_builder.py 用这些片段把世界状态拼成一句画面描述。改画风/场景描述只动这里。
scene_prompt:
  # 全局画风前缀（动漫/galgame 演出风）。Seedream 对动漫风遵循稳定、质感高，
  # 故顺势锁定动漫，负向词反向压掉写实/3D，避免画风在写实↔动漫间乱跳。
  style_prefix: >-
    modern anime style, cel shaded, clean line art, vibrant colors, detailed anime illustration,
    soft cinematic lighting, anime key visual, in the style of Makoto Shinkai and Kyoto Animation,
    wide 16:9 composition, consistent character design, stable eye-level camera angle

  # 每个房间的场景底图描述（真实 place_id -> 英文场景词）
  places:
    nvidia_reception: "bright NVIDIA-style tech office reception lobby with a front desk and glass doors"
    negotiation_room: "modern negotiation meeting room with a long conference table and large city-view windows"
    jensen_private_room: "an executive private office with a desk, laptop and bookshelf, warm lighting"
    openai_hq: "a sleek minimalist AI-company headquarters office with modern decor"
    default: "modern open-plan office space"

  # 各 Phase 的氛围词（按 phase 中的数字匹配，兼容 "Phase 1" / "1"）
  phase_mood:
    "1": "calm first-meeting mood"
    "2": "focused negotiation mood"
    "3": "high-stakes boardroom debate mood"
    "4": "decisive closing-deal mood"
    default: "neutral office mood"

  # 说话人角色（agent_id -> 英文角色描述，用于让"谁在说话"体现在画面里）
  agent_roles:
    "0": "the visitor in business casual"
    "1": "the female receptionist in a dark suit"
    "2": "the company CEO in a leather jacket"
    "3": "a senior tech executive"
    "4": "a memory-chip supplier CEO"
    "5": "a memory-chip supplier CEO"
    "6": "a memory-chip supplier CEO"
    "7": "an AI-company CEO"
    default: "a businessperson"

  # 在场人物片段
  occupants_template: "{count} business people in the room"
  # 说话人片段（无台词时）
  speaker_template: "{role} is speaking and gesturing to the others"
  # 说话人 + 真实台词（Seedream 原生懂中文，据台词画出对应表情/动作）
  speaker_with_line: '{role} is saying to the others: "{line}", with a fitting facial expression and matching hand gesture'
  empty_room: "an empty room, no people"

  # 图生图(img2img)动作模板：以上一帧为参考，锁住同一批人/场景与动漫画风，只改动作
  action_speaker: "keep the exact same people and the same scene and the same anime art style, now {role} is speaking and gesturing while the others listen, detailed anime illustration"
  # 带真实台词的动作（让画面体现 agent 当前实际在说的话/对应动作）
  action_with_line: 'keep the exact same people and the same scene and the same anime art style, now {role} is saying: "{line}", showing a fitting facial expression and body gesture while the others react, detailed anime illustration'
  action_idle: "keep the exact same people and the same scene and the same anime art style, a natural candid moment with a slight pose change, detailed anime illustration"

  # 负向提示：压掉写实/3D（保持动漫稳定）+ 畸形。注意：不含 "text"，
  # 因为我们要 Seedream 画出带中文台词的对话气泡。
  negative: "photorealistic, photograph, realistic photo, 3d render, cgi, deformed faces, extra limbs, extra fingers, watermark, lowres, blurry"
