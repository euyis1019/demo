# F18 场景渲染 · 画面 prompt 模板（L0，纯数据）
# prompt_builder.py 用这些片段把世界状态拼成一句画面描述。改画风/场景描述只动这里。
scene_prompt:
  # 全局画风前缀（扁平卡通）+ 一致性约束（配合每房间固定 seed 降低跨帧抖动）
  style_prefix: >-
    flat illustration cartoon style, clean vector art, soft shadows, flat colors,
    modern corporate setting, wide cinematic 16:9 composition,
    consistent character design, consistent color palette, stable eye-level camera angle,
    same establishing shot framing

  # 每个房间的场景底图描述（真实 place_id -> 英文场景词）
  places:
    nvidia_reception: "bright NVIDIA-style tech office reception lobby with a front desk and glass doors"
    negotiation_room: "modern negotiation meeting room with a long conference table and large city-view windows"
    jensen_private_room: "an executive private office with a desk, laptop and bookshelf, warm lighting"
    openai_hq: "a sleek minimalist AI-company headquarters office with modern decor"
    default: "modern open-plan office space"

  # 各 Phase 的氛围词（按 phase 中的数字匹配，兼容 "Phase 1" / "1"）
  phase_mood:
    "1": "calm first-meeting mood"
    "2": "focused negotiation mood"
    "3": "high-stakes boardroom debate mood"
    "4": "decisive closing-deal mood"
    default: "neutral office mood"

  # 说话人角色（agent_id -> 英文角色描述，用于让"谁在说话"体现在画面里）
  agent_roles:
    "0": "the visitor in business casual"
    "1": "the female receptionist in a dark suit"
    "2": "the company CEO in a leather jacket"
    "3": "a senior tech executive"
    "4": "a memory-chip supplier CEO"
    "5": "a memory-chip supplier CEO"
    "6": "a memory-chip supplier CEO"
    "7": "an AI-company CEO"
    default: "a businessperson"

  # 在场人物片段
  occupants_template: "{count} business people in the room"
  # 说话人片段（带 take 序号，使每句新台词都换一帧；无新发言则 prompt 不变、画面不动）
  speaker_template: "{role} is speaking and gesturing, conversation moment {seq}"
  empty_room: "an empty room, no people"

  # 负向提示，压低畸形/文字水印
  negative: "no text, no watermark, no deformed faces, no extra limbs"
