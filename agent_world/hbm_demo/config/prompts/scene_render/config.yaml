# F18 场景渲染 · 出图模型配置（L0，纯数据）
# 后端 Doubao-Seedream-4.5（火山 Ark），事件驱动 img2img 链。改出图行为只动这里。
scene_render:
  enabled: true
  provider: seedream
  model: doubao-seedream-4-5-251128
  endpoint: https://ark.cn-beijing.volces.com/api/v3/images/generations
  api_key_env: ARK_API_KEY        # 从环境变量读 key，勿写进文件
  size: "2560x1440"               # Seedream 最小 2K（16:9）
  output_width: 1280              # 下发前降到 720p（省 base64 带宽）
  output_height: 720
  seed_base: 7000                 # t2i 锚定帧的每房间固定 seed
  watermark: false
  timeout_sec: 60
  # 连续出图：场景一变就出，最多同时并发多少张（越大越跟得上世界，越费配额）
  max_concurrent_renders: 4
  # img2img 链最大深度，超过则重出 t2i 锚定帧，避免链式漂移
  max_chain_depth: 8
