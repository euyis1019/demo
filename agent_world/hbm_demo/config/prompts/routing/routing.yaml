# F05 story routing — Phase 4 agent_driven (dev_logs/31 §Phase 4 / dev_logs/30 PR3)
routing:
  mode: agent_driven
  stats_display_only: true

  signals:
    approve_keywords:
      - 私人会议室
      - 私密会议室
      - 可以见
      - 带进来
      - 批准
      - 这边请
      - 请跟我来
    reject_keywords:
      - 拒绝
      - 请离开
      - 保安
    expel_keywords:
      - 请离场
      - 谈完了
      - 出去
      - 请出去
      - 你们出去
      - 先出去
      - 可以先走
      - 可以走了
      - 离场
      - 谈够了
      - 请离开
    escort_keywords:
      - 请跟我来
      - 这边请
    return_to_negotiation_keywords:
      - 回谈判室
      - 回到谈判
      - 回主谈判
      - 进谈判室
      - 去谈判室
      - 跟我进谈判室
      - 跟我进
      - 直接去谈判室
      - 方案可行
      - 认可
    # Phase 4 成交「宽泛预筛」词:Jensen 新台词命中任一才花一次 LLM 判定是否真成交。
    # 故意宽泛(宁可多花一次 LLM 也别漏);是否真成交 + join/seed 由 LLM 裁定,
    # 菜单/未接受会被 LLM 判为未成交,不会误结束。
    phase4_deal_keywords:
      - offer
      - 合同
      - 签字
      - 入职
      - 加入
      - 录用
      - 入伙
      - 高管
      - 种子
      - 融资
      - 估值
      - 投资
      - 期权
      - 股权
      - 敲定
      - 算定
      - 同意
      - 这么定
      - 拍桌
      - 收回
      - Distinguished
      - DE
    require_reception_escort_f2f: false
    max_turns_phase1_without_approve: 10
  story_advance:
    enabled: true
