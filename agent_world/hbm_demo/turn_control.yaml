# F07 ABCS — turn control matrix (dev_logs/24 §4)
# enabled: false → 取消 L3/L4/L5 限制，Runner 每 tick 由引擎默认调度全部 Agent；
#   玩家台词 inject 至 scenario 内全部 Agent（见 routing.inject_agent_ids_for_phase）。
# 重构完成后再开启并细化边界规则。

enabled: false

llm_defaults:
  temperature: 0.65
  max_tokens: 500

llm_by_phase:
  Phase 1:
    temperature: 0.65
    max_tokens: 350
  Phase 2:
    temperature: 0.65
    max_tokens: 400
  Phase 3:
    temperature: 0.70
    max_tokens: 500
  Phase 4:
    temperature: 0.70
    max_tokens: 450

active_agents_by_phase:
  Phase 1: [1]
  Phase 2: [2]
  Phase 3: [2, 3, 4, 5, 6]
  Phase 4: [2, 3]

# Tech VP passive RDC replies during Phase 2 (L3 exception, dev_logs/24 §5.3).
passive_agents_by_phase:
  Phase 2: [3]
