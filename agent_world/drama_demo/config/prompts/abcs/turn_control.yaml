enabled: true

# 选人/激活/节奏一律数据驱动（pick_active 走 node.inject_agents 的确定性轮转，无写死名单）。
# 采样参数(temperature/max_tokens)优先取当前 Story Pack meta.llm，缺省用通用默认（见 llm_params.py）。
# 旧版按英文幕名(Phase 1..4)写死 agent_id/冻结名单/SAM 定时/逐幕采样的 phases:/llm_params: 块已整体退役。

world_loop:
  enabled: true
  tick_interval_sec: 1.0
  max_ticks_per_session: 10000
  idle_pause_after_sec: 0
  merge_player_burst: false
  allow_manual_pause: true
  pause_drains_queue: false

player_input:
  max_queue_depth: 32
  inject_on_tick_boundary: true

# F15 Prompt Inspector + L4 thread recap (dev_logs/31 §十六 · Phase 3)
prompt_trace:
  enabled: true
  max_traces_per_session: 5000
  truncate_prompt_chars: 0

recap_window_ticks: 20

# F16 WebSocket world delta stream (dev_logs/31 Phase 5 §14.4)
world_stream:
  enabled: true
  poll_interval_sec: 0.25
  fallback_poll_ms: 5000
