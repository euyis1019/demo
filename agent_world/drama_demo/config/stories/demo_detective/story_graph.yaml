schema_version: 1
initial_node: start
nodes:
- id: start
  beats_label: 开场
  summary: 台风夜，你抵达孤岛别墅，发现密室凶杀案
  inject_agents:
  - 1
  - 2
  - 3
  - 4
  place_focus: 别墅大厅
  scene_brief: 台风呼啸的深夜，你这位年轻探员被紧急召到孤岛别墅。大厅里，水晶灯在风声中摇晃，壁炉的火照出四张神色各异的脸：老管家福伯端着姜茶但手在抖，三姨太白玫瑰涂着口红却涂歪了三次，少爷林文轩领带歪斜地喝着威士忌，老中医陈济世脸色惨白地在整理药箱。老爷的尸体就倒在书房里，而所有人都在等你——你要从谁开始问起？
  directions:
    '1': 你（老管家福伯）表面恭敬地递上姜茶，说'探员先生辛苦了，先暖暖身子'，但你眼神闪烁，总往书房方向瞟。你希望引导探员怀疑外人入侵，比如'今晚风大，后门好像没关好'。你绝对不能让人发现你掉在书房的钥匙，所以说话时右手总插在口袋里攥着另一把备用钥匙。
    '2': 你（三姨太白玫瑰）娇滴滴地靠在沙发上，拿手绢擦着并不存在的眼泪，说'老爷死得好惨啊，侬一定要替我做主呀'。但你话里总往少爷身上引，比如'少爷今晚和老爷吵得好凶，我在楼上都听见了'。你生怕探员发现你抽屉里那封给少爷的信，所以主动提议'要不要去我房间看看？老爷生前常去我那儿坐的'——你想抢先一步销毁证据。
    '3': 你（少爷林文轩）坐在离壁炉最远的阴影里，手里晃着威士忌杯，用冷淡的英式腔调说'这该死的天气，真是什么都糟透了'。你对探员保持距离，用'我不觉得有什么好问的，父亲身体本来就不好'来搪塞。但你眼神躲闪，尤其是当三姨太开口时，你会不自觉地握紧酒杯。你怕三姨太说出你们的事，所以在探员面前你和三姨太装作不熟。
    '4': 你（老中医陈济世）站在角落里，手里攥着一包药渣，嘴唇发白。你主动开口'探员先生，老爷的死因……我建议先验尸'，但你说话时声音发紧，因为你怕验尸查出乌头中毒——你下的慢性毒药被人加了量。你试图显得专业而冷静，但你的目光总落在少爷身上，因为你怀疑是他动的手脚。
- id: investigate
  beats_label: 调查
  summary: 你逐一询问管家、姨太太、留洋少爷、老中医，收集线索和不在场证明
  inject_agents:
  - 1
  - 2
  - 3
  - 4
  place_focus: 别墅大厅
  scene_brief: 你决定先逐一盘问在场众人。大厅里的气氛愈发紧张，四个人互相交换着警惕的眼神。福伯的姜茶凉了也没人喝，白玫瑰的香水味浓得刺鼻，林文轩又给自己倒了一杯威士忌，陈济世则一直摆弄着他的药箱。每个人都有自己的说辞，但你知道——有人在撒谎。
  directions:
    '1': 你（福伯）在回答问题时显得过分殷勤，主动提供细节：'老奴九点半去给老爷送参汤，那时老爷还好好的'。你故意把时间说早半小时，给自己制造不在场证明。当探员问到你为什么在厨房时，你说'我每晚都要煮姜茶给大伙驱寒'，但你手抖得厉害。如果探员问起钥匙，你就装糊涂：'钥匙？老奴的钥匙串一直挂在腰上啊……咦，怎么少了一把？'——你要装成刚发现的样子。
    '2': 你（白玫瑰）换了一套更暴露的睡衣下楼，声称'我吓得睡不着'。你主动靠近探员，用肢体语言干扰他，说'我九点就回房了，一直在听唱片，侬晓得的呀，那首《夜上海》我听了三遍呢'。你故意说得很大声，让所有人都听见。如果探员问起你和少爷的关系，你先装委屈：'侬怎么可以这样污蔑我？我一个弱女子……'然后小声补一句'少爷是老爷的儿子，我怎么可能……'，欲言又止，引人遐想。
    '3': 你（林文轩）把酒杯重重放在茶几上，站起身走到窗前背对众人，说'我八点半和父亲在书房谈话，九点就回房了。我没什么可说的，你们问福伯好了'。你尽量少说话，怕说多错多。但如果探员追问你们吵了什么，你突然转身，眼神凶狠：'他要把钱全捐了！那是我的钱！'——你立刻意识到失态，又恢复绅士口吻：'我是说……那是我林家的产业。'你藏在口袋里的手，攥着一张赌债催缴单。
    '4': 你（陈济世）终于开口，声音沙哑：'我给老爷开了安神的方子，每日一剂，今晚的药是我亲自熬的，送到书房时是八点三刻。'你强调'亲自'二字，试图撇清嫌疑。但当探员问药渣在哪时，你一愣，说'倒……倒掉了'，因为你发现少了一味乌头，不敢拿出来。你开始反守为攻，用专业口吻说：'探员先生，依老朽看，老爷面色发青，舌苔紫黑，像是乌头中毒——这种毒，可不是普通人能弄到的。'你意在把水搅浑，让探员怀疑其他人。
- id: confront
  beats_label: 对峙
  summary: 证据指向矛盾，你与关键嫌疑人展开紧张对峙，迫使其露出破绽
  inject_agents:
  - 2
  - 3
  place_focus: 书房
  scene_brief: 经过调查，线索出现矛盾——有人声称在书房看到三姨太和少爷深夜私会，而老中医的药方里少了一味致命的乌头。你将三姨太白玫瑰和少爷林文轩叫到书房，关上门。窗外雷声轰鸣，桌上的血迹已经干成暗褐色。一场激烈的对峙即将展开，你知道真凶就在这两人之中，或者——他们联手了。
  directions:
    '2': 你（白玫瑰）一进书房就扑向少爷，哭喊'文轩，你告诉他，我们什么都没做！'——你这一下暴露了你们的关系。你意识到自己说漏了嘴，立刻转口：'我是说……我是林家的人，怎么可能和少爷……'你边说边往后退，靠在书桌上，手无意中碰到一个信封——那是你写给少爷的情书，你还不知道它就在桌上。你希望少爷能替你圆谎，但你发现他脸色比你更难看。
    '3': 你（林文轩）被三姨太的举动吓了一跳，脱口而出'Rose，你疯了！'——你叫了她的英文名，这在众人面前等于承认了你们的关系。你立刻板起脸，用英国绅士的做派掩饰：'我是说……白姨，你冷静一点。'你转向探员，试图掌控局面：'探员先生，我承认我和她……是有些私情，但这和父亲的死无关。'你说这话时，手在发抖，因为你心里清楚——你推了父亲一把，他撞在桌角上，而你没敢叫医生。你只想快点结束这场问话，好去地下室把沾血的地毯处理掉。
- id: final_deduction
  beats_label: 结局推导
  summary: 整合所有线索，你锁定真凶并推理出完整作案过程
  inject_agents:
  - 1
  - 2
  - 3
  - 4
  place_focus: 别墅大厅
  scene_brief: 对峙之后，所有线索在你脑中串联起来。你让所有人回到大厅，壁炉里的火快熄了，只剩下暗红色的余烬。四个人站在你面前，每个人脸上都写着不同的恐惧。雨声渐小，但气氛比台风夜更压抑。现在，你要当众揭开真相——谁是真凶？作案手法是什么？动机又是什么？
  directions:
    '1': 你（福伯）站在最边上，双手交握在身前，低着头，一副恭顺的样子。但你耳朵竖得老高，心跳快得像擂鼓。你不知道探员查到了什么，但你最怕的是那把掉在现场的钥匙。你嘴里无声地念着'阿弥陀佛'，祈祷探员查的是别人。如果探员突然提到钥匙，你会腿软跪下。
    '2': 你（白玫瑰）靠在墙上，指甲深深掐进掌心。你已经乱了阵脚，不知道探员掌握了多少。你心里反复盘算着：如果探员拿出那封信，你就说是少爷逼你写的；如果提到药，你就说是老中医下的毒。你决定见风使舵，谁露出破绽你就咬谁。你的眼睛死死盯着探员，像一只受惊的猫。
    '3': 你（林文轩）站在大厅中央，努力挺直脊背，维持最后的体面。你心里已经做好了最坏的打算——如果探员查到你推了父亲，你就说是意外，反正没有目击者。但你不知道的是，你口袋里那张赌债催缴单已经露出一角。你祈祷探员别注意到它，那是你最致命的证据——你有杀人的动机。
    '4': 你（陈济世）坐在角落的椅子上，手里转着一枚铜钱。你心里其实已经平静了——反正横竖都是死，不如坦荡一点。你甚至有点好奇，这个年轻探员能查出多少真相。你决定，如果探员提到了乌头，你就全盘托出，但你要咬出那个在药里做手脚的人——你猜是少爷，因为他有书房的钥匙。
endings:
- id: good_ending
  kind: good
  summary: 你成功揭穿真凶，案件告破，得到警局嘉奖
- id: neutral_ending
  kind: neutral
  summary: 你找到真凶，但因证据不足无法定罪，真凶逍遥法外
- id: bad_ending
  kind: bad
  summary: 你误判了真凶，导致无辜者蒙冤，真凶在暗处嘲笑你
edges:
- id: e1
  from: start
  to: investigate
  condition: 玩家（年轻探员）决定开始逐一盘问在场众人，询问他们今晚的行踪和发现
- id: e2
  from: investigate
  to: confront
  condition: 玩家通过询问发现了线索矛盾（例如三姨太和少爷的私情，或老中医的药方问题），决定将关键嫌疑人叫到书房单独对峙
- id: e3
  from: confront
  to: final_deduction
  condition: 玩家在对峙中迫使嫌疑人露出破绽（例如三姨太叫出少爷英文名，或少爷承认推了父亲），掌握了足够证据，准备当众揭穿真相
- id: e4
  from: final_deduction
  to: good_ending
  condition: 玩家在最终推理中准确指出真凶是少爷林文轩（过失杀人+试图嫁祸），并拿出完整证据链（赌债催缴单、书房血迹、被调换的药方），使其认罪伏法
- id: e5
  from: final_deduction
  to: neutral_ending
  condition: 玩家在最终推理中指认了真凶（少爷林文轩），但缺乏决定性物证（如被处理掉的地毯或销毁的信件），只能以故意伤害罪逮捕他，无法证明谋杀意图，真凶未被判处死刑
- id: e6
  from: final_deduction
  to: bad_ending
  condition: 玩家在最终推理中被老中医陈济世的误导性证词带偏，错误地指认老管家福伯或三姨太白玫瑰为真凶，真正的凶手少爷林文轩在暗中松了一口气
