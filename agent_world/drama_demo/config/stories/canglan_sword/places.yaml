places:
- place_id: place_gate
  capacity: 10
  attrs:
    summary: 苍澜剑派山门，青石台阶上刻着剑痕，两旁松柏森森。夜风穿过门廊，灯笼摇曳。
    behavior_hint: 适合夜间值守、低声密谈、观察来往之人。
- place_id: place_backhill
  capacity: 5
  attrs:
    summary: 后山密林，怪石嶙峋，月光斑驳。有一处废弃凉亭，是弟子们私下会面的地点。
    behavior_hint: 适合密谋、偷听、跟踪、设置陷阱。
- place_id: place_hall
  capacity: 20
  attrs:
    summary: 苍澜正厅，正中悬挂『剑魂』匾额，两侧陈列历代掌门画像。掌门卧榻置于屏风后。
    behavior_hint: 适合议事、对峙、揭发、举行仪式。
- place_id: place_study
  capacity: 3
  attrs:
    summary: 凌轩的书房，书架凌乱，案上散落着信件与剑谱抄本。窗台有一盆枯兰。
    behavior_hint: 适合潜入、搜索、盗取信件、触发陷阱。
coverage:
- src: place_gate
  dst: place_backhill
  latency_ticks: 2
- src: place_gate
  dst: place_hall
  latency_ticks: 1
- src: place_backhill
  dst: place_study
  latency_ticks: 3
- src: place_hall
  dst: place_study
  latency_ticks: 2
