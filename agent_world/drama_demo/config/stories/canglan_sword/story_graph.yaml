schema_version: 1
initial_node: task_1
nodes:
- id: task_1
  beats_label: 任务一·夜闻密谋
  summary: 深夜巡夜时，你无意间听到大弟子凌轩与鬼影在后山密谋夺位，次日周平师兄让你暗中搜集凌轩的可疑动向，作为初步探查。
  inject_agents:
  - 1
  - 2
  - 4
  place_focus: place_gate
  scene_brief: 深夜，你从后山回来，神色慌张。看门师兄周平在山门值守，他低声叫住你，暗示后山不太平，并交给你一个任务：暗中观察凌轩近几日的动向，尤其是他与外人来往的情况。周平语气含糊，似乎知道什么但不敢明说。凌轩与鬼影刚刚密谋完，此时凌轩正从后山返回，路过山门，看到你和周平在说话，眼神闪过一丝警惕。
  directions:
    '1': 凌轩看到你和周平在说话，心中起疑。他意图试探你是否听到了什么。他会温和地笑着走过来，问你在山门做什么，并嘱咐你早些休息。他的手段是装作关心，实则观察你的反应。他绝不能说出口的是：他怀疑你听到了他后山的密谋，想找机会除掉你。
    '2': 鬼影此时尚未现身，但躲在暗处观察。他意图确认你是否是威胁。他不会直接出面，而是通过发出声响或投掷石子来分散你的注意力，试探你的警觉。他绝不能说出口的是：他已经在凌轩书房布下陷阱，等着你上钩。
    '4': 周平意图让你帮忙搜集凌轩的可疑动向，但不敢直说。他会压低声音，用含糊的话暗示你留意凌轩的夜行和外来访客。他的手段是装作关心你的安全，说后山有野兽出没，实则提醒你那里有秘密。他绝不能说出口的是：他暗恋沈孤鸿，想借你之手扳倒凌轩，自己坐收渔翁之利。
- id: task_2
  beats_label: 任务二·暗查线索
  summary: 二师姐沈孤鸿察觉你形迹可疑，你向她坦白所见，她命你设法偷取凌轩与鬼影往来的密信，以作证据。
  inject_agents:
  - 3
  place_focus: place_hall
  scene_brief: 第二日清晨，你在正厅附近徘徊，二师姐沈孤鸿叫住你，她注意到你神色有异，直接质问你是否知道什么。你向她坦白昨夜所见，她沉吟片刻，命你设法潜入凌轩书房，偷取凌轩与鬼影往来的密信作为证据。她语气严厉，但眼神中透露出信任与期待。
  directions:
    '3': 沈孤鸿意图让你获取确凿证据，以便她联合长老废黜凌轩。她会用坚定的语气下达命令，强调此事关乎门派存亡，并承诺会暗中保护你。她的手段是恩威并施，先施压再给承诺。她绝不能说出口的是：她其实已经掌握部分线索，但需要你手中的直接证据才能行动，她内心担心你的安危，但更怕错失良机。
- id: task_3
  beats_label: 任务三·密室取证
  summary: 你趁凌轩外出，潜入他的书房盗取密信，却遭遇鬼影设下的陷阱，必须脱身并保留证据。
  inject_agents:
  - 1
  - 2
  place_focus: place_study
  scene_brief: 你趁凌轩外出，潜入他的书房。书架上信件杂乱，你正在翻找时，突然听到门外有脚步声——是凌轩回来了！你慌忙躲到书架后，却发现鬼影早已在书房内布下陷阱：地上有细线连着铃铛，你一不留意就会触发警报。你必须找到密信并安全脱身，同时不能惊动外面的人。
  directions:
    '1': 凌轩回到书房，他意图确认书房是否有人闯入。他会假装在案前翻找东西，实则仔细观察四周是否有异样。他的手段是故意说一句『密信还在，先生放心』来试探是否有人偷听。他绝不能说出口的是：他知道鬼影在房里设了陷阱，想借此抓住闯入者。
    '2': 鬼影隐藏在书房暗处，他意图抓住你这个闯入者并灭口。他会故意触发一些小的机关来惊吓你，逼你露出破绽。他的手段是冷笑着低声说话，让你知道自己已落入陷阱。他绝不能说出口的是：他真正的目标不是抓你，而是借你之手将密信偷走，好让他有理由除掉凌轩。
- id: task_4
  beats_label: 收官·决断苍澜
  summary: 带着证据，你必须在掌门病榻前做出选择：揭发凌轩、与凌轩交易、或携证据逃离，决定全派命运。
  inject_agents:
  - 1
  - 3
  - 4
  place_focus: place_hall
  scene_brief: 你带着密信回到正厅，掌门病榻前，沈孤鸿、凌轩、周平都在场。掌门气息奄奄，但神志尚清。沈孤鸿当众质问凌轩，凌轩则反咬你污蔑。你必须当众做出决断：是拿出证据揭发凌轩，还是与凌轩私下交易，或是携证据逃离。所有人的目光都集中在你身上，每一句话都将决定结局。
  directions:
    '1': 凌轩意图自保，他会先发制人，指责你勾结外人污蔑他。他的手段是先声夺人，用大师兄的威严压你，并暗示你若有证据就是伪造。他绝不能说出口的是：他其实已经安排鬼影在外面接应，一旦事情败露就杀人灭口。
    '3': 沈孤鸿意图让你当众揭发，她会力挺你，为你提供保护。她的手段是大声呵斥凌轩，让他闭嘴，然后鼓励你拿出证据。她绝不能说出口的是：她其实已经安排了长老在屏风后埋伏，只要证据确凿就立刻拿下凌轩。
    '4': 周平意图在关键时刻表明立场，但又不愿彻底得罪凌轩。他会装作中立，说『师弟，你想清楚再说』，实则暗示你选择安全的道路。他绝不能说出口的是：他其实已经暗中通知了鬼影，准备在混乱中保护沈孤鸿离开。
endings:
- id: ending_good
  kind: good
  summary: 你成功揭发凌轩与鬼影，沈孤鸿率众制服逆贼，掌门临终前指定你为继承人，苍澜剑派重归正道。
- id: ending_neutral
  kind: neutral
  summary: 你选择与凌轩交易，交出部分证据换取生存与地位，凌轩成为掌门，苍澜剑派在阴影中苟延。
- id: ending_bad
  kind: bad
  summary: 你携证据逃离，但鬼影追杀而至，证据被毁，你流落江湖，苍澜剑派沦为凌轩的傀儡。
edges:
- id: edge_1_2
  from: task_1
  to: task_2
  condition: 玩家接受了周平的暗示，并向沈孤鸿坦白了昨夜后山所见，沈孤鸿因此信任玩家并交付新任务。
- id: edge_2_3
  from: task_2
  to: task_3
  condition: 玩家答应了沈孤鸿的要求，并实际潜入凌轩书房试图盗取密信。
- id: edge_3_4
  from: task_3
  to: task_4
  condition: 玩家成功从书房脱身，并带出了密信（无论是否完整）。
- id: edge_4_good
  from: task_4
  to: ending_good
  condition: 玩家在掌门和众人面前拿出密信，当众指证凌轩勾结鬼影，并接受沈孤鸿的庇护。
- id: edge_4_neutral
  from: task_4
  to: ending_neutral
  condition: 玩家私下与凌轩交易，交出密信或销毁证据，换取自身安全或地位。
- id: edge_4_bad
  from: task_4
  to: ending_bad
  condition: 玩家没有拿出证据，而是试图逃离现场或独自逃走，导致证据被凌轩或鬼影夺走。
