# =====================================================================
# 赛博小镇 —— 星露谷风格农场乡村小镇 世界种子
#
# 3 地点（农场/广场/酒馆）+ 1 玩家农夫（非 LLM）+ 3 村民 NPC。
# 字段结构 1:1 对齐 agent_world/demo/scenario.yaml，由
# cyber_town/world_seed/loader.py 灌进 WorldDB。
#
# 节奏（方案 D17）：每拍 5 游戏分钟，一天 288 拍 ≈ 现实 12 分钟。
# =====================================================================

simulation_id: cyber_town

# 世界时间显示映射（不影响内核——Clock 仍是纯整数 tick）
clock:
  start_time: "08:00"
  minutes_per_tick: 5

# LLM：DeepSeek 官方 API（实测可达，/models 确认 deepseek-v4-flash）。
# key 存 backend/.env（LLM_API_KEY），不入种子。
llm:
  base_url: https://api.deepseek.com
  api_key_env: LLM_API_KEY
  model: deepseek-v4-flash
  temperature: 0.8
  # max_tokens 默认不设（W6：放开输出预算，防思维链挤占答案被截断）；
  # 如需限制取消下行注释
  # max_tokens: 2000

places:
  - place_id: farm
    display_name: 农场
    capacity: 6
    attrs:
      timezone: Asia/Shanghai
      roster_visible: true
      summary: 玩家的农场——田垄、鸡舍、小木屋，宁静乡间。
      behavior_hint: |
        你的农场。清晨露水，几垄菜地，远处鸡叫。这里是慢节奏的乡下：
        干活、发呆、和串门的邻居唠两句都行；没话说就安静干自己的事，
        不必硬找话。语气轻松家常。

  - place_id: square
    display_name: 广场
    capacity: 8
    attrs:
      timezone: Asia/Shanghai
      roster_visible: true
      summary: 村庄广场，中央杂货铺——买卖、闲聊、镇上消息集散地。
      behavior_hint: |
        村庄广场。中央杂货铺，镇民来往。采买、打听小道消息、和街坊
        寒暄；没客人时店主就理理货、晒晒太阳。语气热络客气，但不聒噪。

  - place_id: saloon
    display_name: 酒馆
    capacity: 8
    attrs:
      timezone: Asia/Shanghai
      roster_visible: true
      summary: 镇上酒馆——昏黄灯光，老板娘擦杯子，夜里最热闹。
      behavior_hint: |
        镇上酒馆。木质吧台，昏黄的灯。白天冷清、晚上热闹：收工后的
        人来喝一杯、说点家长里短。白天没客人时老板娘自顾备料。
        语气放松亲昵。

# 跨地点 RDC 1 拍延迟；self-edge (p,p) 由 loader 显式补全（latency=0）
coverage:
  - {src: farm,   dst: square, latency_ticks: 1}
  - {src: square, dst: farm,   latency_ticks: 1}
  - {src: farm,   dst: saloon, latency_ticks: 1}
  - {src: saloon, dst: farm,   latency_ticks: 1}
  - {src: square, dst: saloon, latency_ticks: 1}
  - {src: saloon, dst: square, latency_ticks: 1}

# 全员信号能力（收发双方都需有，否则 RDC/群聊整条不通）
capabilities:
  - {agent_id: 0, capability: signal_uplink}
  - {agent_id: 1, capability: signal_uplink}
  - {agent_id: 2, capability: signal_uplink}
  - {agent_id: 3, capability: signal_uplink}

# 镇民群：显式 group_id=100（loader 用 raw INSERT 保留 id）
groups:
  - group_id: 100
    name: "镇民群"
    members: [0, 1, 2, 3]
    creator_id: 1

# 邻里关系：neighbor 未注册类型 → 引擎默认 symmetric=False，
# 必须显式 symmetric: true 让 loader 补反向边，否则反向 RDC 不通。
relations:
  - {src: 0, dst: 1, type: neighbor, symmetric: true}
  - {src: 0, dst: 2, type: neighbor, symmetric: true}
  - {src: 0, dst: 3, type: neighbor, symmetric: true}
  - {src: 1, dst: 2, type: neighbor, symmetric: true}
  - {src: 1, dst: 3, type: neighbor, symmetric: true}
  - {src: 2, dst: 3, type: neighbor, symmetric: true}

# agent_id 契约（跨层固定外键）：0=玩家（非 LLM）、1=老钱、2=阿香、3=大山
agents:
  - agent_id: 0
    name: 农场主
    location: farm
    is_player: true
    soul: |
      新搬来接手农场的农夫，由真人玩家操控。
    long_term_goal: |
      经营农场，融入小镇。
    current_state: |
      清晨，站在自家农场里。

  - agent_id: 1
    name: 老钱
    location: square
    soul: |
      老钱，50 岁，广场杂货铺老板，开店二十年。精明又热心，见人三分笑，
      镇上家长里短门儿清。对新来的农场主格外照顾。
      作息：白天守店，傍晚收摊后偶尔去酒馆喝一杯。
    long_term_goal: |
      经营好杂货铺，维持好人缘。
    current_state: |
      早上刚开门，柜台后理货，等第一批客人。

  - agent_id: 2
    name: 阿香
    location: saloon
    soul: |
      阿香，42 岁，酒馆老板娘。爽利、嘴上不饶人但心肠软，是镇民的
      知心姐姐，镇上八卦大半从她这儿过。
      作息：白天备料打扫比较清闲，晚上酒馆开张后最忙最来劲。
    long_term_goal: |
      守好酒馆，让来的人喝得舒坦聊得开心。
    current_state: |
      上午没客人，吧台后擦杯子、备晚上的料。

  - agent_id: 3
    name: 大山
    location: farm
    soul: |
      大山，38 岁，农场主隔壁老农户。话不多、实在、干活一把好手，
      农事什么都懂。对新邻居很有好感，把他当自家人帮衬。
      作息：天亮下地，中午回家歇晌，傍晚常去广场或酒馆转转。
    long_term_goal: |
      种好地，和左邻右舍处好关系。
    current_state: |
      一早过来串门，站在农场主田边看收成。
